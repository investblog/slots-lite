<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slots-lite — playground</title>
<meta name="description" content="A slot machine drawn by code: seeded reels and cabinet, a brand-aware classic palette, line or flat, as an SVG string.">
<style>
	:root { --bg: #111318; --panel: #1a1d24; --text: #e6e6e6; --muted: #9aa0aa; --line: #2b2f38; --accent: #00abf3; }
	body.light { --bg: #f4f5f8; --panel: #ffffff; --text: #1d2026; --muted: #5d6470; --line: #dfe2e8; --accent: #0084bd; }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
	main { display: grid; grid-template-columns: 18rem 1fr; min-height: 100vh; }
	aside { padding: 16px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
	h1 { font-size: 16px; margin: 0; }
	label, .field { display: grid; grid-template-columns: 5.5rem 1fr; align-items: center; gap: 8px; color: var(--muted); }
	input[type=text], select { width: 100%; padding: 4px 6px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
	.row { display: flex; gap: 6px; align-items: center; }
	button { padding: 4px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
	button:hover { border-color: var(--accent); }
	.brand input { width: 2.2rem; height: 1.6rem; padding: 0; border: 0; background: none; }
	#stage { display: grid; place-items: center; padding: 24px; }
	/* a three-reel machine is roughly square, so the single view is capped by width AND height */
	#stage > svg { width: min(40rem, 100%, 88vh); height: auto; }
	/* align-content, or the rows share the stage's full height and a short sheet splits in two */
	#stage.sheet { grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); align-items: start; align-content: start; gap: 16px; }
	#stage.icons { grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); }
	#stage.sheet figure { margin: 0; text-align: center; color: var(--muted); font-size: 12px; }
	#stage.sheet figure[data-seed] { cursor: pointer; }
	#stage.sheet svg { width: 100%; height: auto; display: block; }
	/* a symbol is drawn for the reel's paper: the bar's near-black plaque vanishes on a dark page */
	#stage.icons svg { padding: 12px; border-radius: 8px; }
	.meta { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
	footer { margin-top: auto; color: var(--muted); font-size: 12px; }
	a { color: var(--accent); }
	@media (max-width: 48rem) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<main>
	<aside id="panel">
		<h1>slots-lite</h1>
		<label>seed <input type="text" data-k="seed" value="1"></label>
		<div class="row"><button id="prev">‹</button><button id="random">random</button><button id="next">›</button></div>
		<label>show <select id="mode">
			<option value="one">one machine</option>
			<option value="sheet">contact sheet (24 seeds)</option>
			<option value="results">every result</option>
			<option value="symbols">the symbols</option>
		</select></label>
		<label>theme <select data-k="theme"><option>dark</option><option>light</option></select></label>
		<label class="brand">brand <span class="row"><input type="color" data-b="0" value="#00abf3"><input type="color" data-b="1" value="#d6af3c"><input type="color" data-b="2" value="#a91455"><button id="spintax" title="the spintax triad">↺</button></span></label>
		<label>style <select data-k="style"><option value="auto">auto — cabinet by theme</option><option>flat</option><option>line</option></select></label>
		<label>reels <select data-k="reels"><option selected>3</option><option>4</option><option>5</option></select></label>
		<label>rows <select data-k="rows"><option selected>3</option><option>1</option></select></label>
		<label>result <select data-k="result"><option value="">— the seed's —</option><option>jackpot</option><option>three</option><option>bars</option><option>cherries</option><option>mixed</option></select></label>
		<label>lattice <select data-k="lattice"><option>auto</option><option>trigon</option><option>hex</option><option>octagon</option><option>none</option></select></label>
		<div class="field">draw <span class="row"><label class="row"><input type="checkbox" data-k="lever" checked>lever</label><label class="row"><input type="checkbox" data-k="payline" checked>payline</label></span></div>
		<label>classic <span class="row"><input type="checkbox" data-k="classic" checked><span class="meta">off = gem, star, coin only</span></span></label>
		<label>weight <input type="range" data-k="weight" min="0.4" max="2.5" step="0.1" value="1"></label>
		<label>motion <span class="row"><input type="checkbox" data-k="motion"><input type="range" data-k="speed" min="0.25" max="4" step="0.25" value="1" title="speed"><button id="replay" title="spin again">↻</button></span></label>
		<p class="meta" id="rm" hidden>Your system asks for reduced motion: the spin is shown at rest, as the library intends.</p>
		<p class="meta" id="bytes"></p>
		<footer>Made in <a href="https://301.st">301</a> · for <a href="https://spintax.net">spintax.net</a></footer>
	</aside>
	<section id="stage"></section>
</main>
<script>
	// The library is loaded cache-busted: a stale cached script once produced a convincing false
	// FAIL in a sibling's verify page, and a playground showing yesterday's machine is the same
	// trap. If a file:// load refuses the query, the plain path is tried once.
	(function () {
		var s = document.createElement('script');
		s.src = 'slots.js?ts=' + Date.now();
		s.onload = app;
		s.onerror = function () { var t = document.createElement('script'); t.src = 'slots.js'; t.onload = app; document.head.appendChild(t); };
		document.head.appendChild(s);
	})();

	function app() {
		var TRIAD = ['#00abf3', '#d6af3c', '#a91455'];
		var RESULTS = ['jackpot', 'three', 'bars', 'cherries', 'mixed'];
		var CLASSIC = ['seven', 'bar', 'bell', 'cherry', 'lemon', 'plum'], PROC = ['gem', 'star', 'coin'];
		var opts = { seed: '1', theme: 'dark', brand: TRIAD.slice(), style: 'auto', reels: 3, rows: 3,
			result: '', lattice: 'auto', lever: true, payline: true, classic: true, weight: 1,
			motion: false, speed: 1 };
		var stage = document.getElementById('stage'), mode = document.getElementById('mode');
		var seedInput = document.querySelector('[data-k=seed]'), bytes = document.getElementById('bytes');

		// an empty field is not a seed: it would fall through to the string branch
		function seedValue() { return /^\d+$/.test(opts.seed) ? Number(opts.seed) : (opts.seed || 1); }
		// what the controls mean, as options the library reads: 'auto' and an empty result are left
		// out rather than passed, so the defaults on screen are the plain call's bytes — an explicit
		// lattice: 'auto' draws the same picture under different ids. lever, payline and classic are
		// tested `!== false` there, so an unchecked box sends a literal false.
		function live(extra) {
			var o = Object.assign({}, opts, { seed: seedValue() }, extra || {});
			if (o.style === 'auto') delete o.style;
			if (o.lattice === 'auto') delete o.lattice;
			if (!o.result) delete o.result;
			if (!o.motion) { delete o.motion; delete o.speed; }
			return o;
		}
		function tile(markup, caption, seed) {
			return '<figure' + (seed == null ? '' : ' data-seed="' + seed + '"') + '>' +
				markup + '<figcaption>' + caption + '</figcaption></figure>';
		}

		function render() {
			document.body.classList.toggle('light', opts.theme === 'light');
			var o = live(), html = '', i;
			stage.className = '';
			if (mode.value === 'sheet') {
				stage.className = 'sheet';
				// a string seed varies by suffix — 'example.com-7' is a seed like any other
				var num = typeof o.seed === 'number';
				for (i = 0; i < 24; i++) {
					var s = num ? o.seed + i : o.seed + '-' + i;
					html += tile(Slots.machine(live({ seed: s })), String(s), s);
				}
			} else if (mode.value === 'results') {
				stage.className = 'sheet';
				html += tile(Slots.machine(live({ result: '' })), 'the seed\'s');
				for (i = 0; i < RESULTS.length; i++) {
					html += tile(Slots.machine(live({ result: RESULTS[i] })), RESULTS[i]);
				}
			} else if (mode.value === 'symbols') {
				stage.className = 'sheet icons';
				// under classic: false the library draws only the procedural three, and a classic name
				// would be replaced by the seed's pick — so the tiles follow the switch
				var names = o.classic ? CLASSIC.concat(PROC) : PROC, paper = Slots.palette(o.brand, { theme: o.theme }).strip;
				if (o.strip && o.strip !== 'auto') paper = o.strip;
				for (i = 0; i < names.length; i++) {
					html += tile(Slots.symbol(Object.assign({}, o, { symbol: names[i] })), names[i]);
				}
				for (i = 2; o.classic && i <= 3; i++) {
					html += tile(Slots.symbol(Object.assign({}, o, { symbol: 'bar', bars: i })), 'bar, bars: ' + i);
				}
			} else {
				html = Slots.machine(o);
			}
			stage.innerHTML = html;
			if (mode.value === 'symbols') stage.querySelectorAll('svg').forEach(function (svg) { svg.style.background = paper; });
			// the SVG itself, not the <figure>/<figcaption> around it
			var svgs = stage.querySelectorAll('svg'), total = 0;
			for (var k = 0; k < svgs.length; k++) total += svgs[k].outerHTML.length;
			bytes.textContent = total + ' bytes of SVG' + (svgs.length > 1 ? ' in ' + svgs.length + ' pictures' : '');
		}
		function setSeed(v) { opts.seed = String(v); seedInput.value = opts.seed; render(); }

		document.getElementById('panel').addEventListener('input', function (e) {
			var t = e.target, k = t.getAttribute('data-k'), b = t.getAttribute('data-b');
			if (b != null) opts.brand[+b] = t.value;
			else if (k === 'motion') opts.motion = t.checked && 'spin';
			else if (k === 'lever' || k === 'payline' || k === 'classic') opts[k] = t.checked;
			// rows is tested `=== 1`: a <select> gives the string '1', so every number is converted
			else if (k === 'reels' || k === 'rows' || k === 'weight' || k === 'speed') opts[k] = Number(t.value);
			else if (k) opts[k] = t.value;
			render();
		});
		document.getElementById('random').onclick = function () { setSeed(Math.floor(Math.random() * 1e6)); };
		document.getElementById('prev').onclick = function () { var v = seedValue(); setSeed(typeof v === 'number' ? Math.max(0, v - (mode.value === 'sheet' ? 24 : 1)) : 1); };
		document.getElementById('next').onclick = function () { var v = seedValue(); setSeed(typeof v === 'number' ? v + (mode.value === 'sheet' ? 24 : 1) : 1); };
		// the spin is one-shot: new elements start it again, and nothing else about the picture changes
		document.getElementById('replay').onclick = function () {
			if (!opts.motion) { opts.motion = 'spin'; document.querySelector('[data-k=motion]').checked = true; }
			render();
		};
		document.getElementById('spintax').onclick = function () {
			opts.brand = TRIAD.slice();
			document.querySelectorAll('[data-b]').forEach(function (el, i) { el.value = TRIAD[i]; });
			render();
		};
		stage.addEventListener('click', function (e) {
			var f = e.target.closest('figure');
			if (f && f.getAttribute('data-seed')) { mode.value = 'one'; setSeed(f.getAttribute('data-seed')); }
		});
		if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
			document.getElementById('rm').hidden = false;
		}
		render();
	}
</script>
</body>
</html>
